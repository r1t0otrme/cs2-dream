<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CS2 · Инвентарь мечты</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="mark">◈</span>
    <span class="bt">CS2</span>
    <span class="bs">инвентарь мечты</span>
  </div>
  <div class="topact">
    <button class="chip" id="btnCur" title="валюта">$</button>
    <button class="iconbtn" id="btnMenu" title="настройки">⋯</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab is-on" data-tab="now">Сейчас</button>
  <button class="tab" data-tab="dream">Мечта</button>
</nav>

<section class="bars" id="bars"></section>

<main class="grid" id="grid" aria-live="polite"></main>

<footer class="foot">
  <div id="catInfo">загрузка базы…</div>
</footer>

<div class="boot" id="boot">
  <div class="boot-in">
    <div class="boot-logo">◈</div>
    <div class="boot-t">CS2 · инвентарь мечты</div>
    <div class="boot-s" id="bootMsg">загружаю базу цен…</div>
    <div class="boot-track"><i id="bootBar"></i></div>
  </div>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js?v=5"></script>
</body>
</html>
