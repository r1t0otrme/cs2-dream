name: prices

# Бот обновляет самые старые цены в data/live.json.
# Никому не нужен токен: Actions сам коммитит результат,
# все читатели получают свежую базу при открытии страницы.
#
# Работает адаптивно (см. tools/refresh_prices.py): идёт по очереди, пока
# не кончится бюджет времени или прокси не ответит 429. Сколько успел -
# столько и закоммитил, поэтому база не «застревает» на одном месте.

on:
  schedule:
    - cron: "17 * * * *"    # каждый час
  workflow_dispatch:
    inputs:
      max:
        description: "Сколько цен максимум"
        default: "150"
      budget:
        description: "Бюджет времени, секунд"
        default: "600"

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Обновить самые старые цены
        env:
          PRICE_MAX: ${{ github.event.inputs.max || '150' }}
          PRICE_BUDGET: ${{ github.event.inputs.budget || '600' }}
          PRICE_PAUSE: "1.0"
        run: python tools/refresh_prices.py

      - name: Закоммитить, если что-то изменилось
        run: |
          git config user.name "cs2-dream-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          git commit -m "цены: автообновление (самые старые)"
          git pull --rebase --autostash
          git push
