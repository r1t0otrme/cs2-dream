name: prices

# Раз в сутки: один запрос к агрегатору -> пересборка data/catalog.json -> коммит.
# Steam напрямую не дёргаем (он отдаёт 429 на серверные IP), поэтому это
# ровно ОДИН запрос за файл, а не 19 тысяч запросов за скинами.

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC каждый день
  workflow_dispatch:        # можно запустить руками из вкладки Actions
    inputs:
      feed:
        description: "URL фида цен"
        required: false
        default: "https://prices.csgotrader.app/latest/prices_v6.json"

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Пересобрать базу цен
        env:
          FEED: ${{ github.event.inputs.feed || 'https://prices.csgotrader.app/latest/prices_v6.json' }}
        run: |
          python tools/build.py --feed "$FEED" --out data/catalog.json

      - name: Проверить, что база не пустая
        run: >
          python -c "import json,sys;
          n=json.load(open('data/catalog.json',encoding='utf-8')).get('count',0);
          print('предметов:',n);
          sys.exit('слишком мало предметов - коммит отменён' if n<3000 else 0)"

      - name: Закоммитить
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "цены не изменились"
          else
            git commit -m "prices: $(date -u +%F)"
            git push
          fi
