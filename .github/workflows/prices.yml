name: prices

# Бот обновляет самые старые цены в data/live.json.
# Никому не нужен токен: Actions сам коммитит результат,
# все читатели получают свежую базу при открытии страницы.

on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Обновить самые старые цены
        env:
          PRICE_LIMIT: "20"
          PRICE_PAUSE: "1.2"
        run: python tools/refresh_prices.py

      - name: Закоммитить, если что-то изменилось
        run: |
          git config user.name "cs2-dream-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then
            echo "нечего коммитить"
            exit 0
          fi
          git commit -m "цены: автообновление (20 самых старых)"
          git pull --rebase --autostash
          git push
